# @package _global_

defaults:
  - falcon_hm3d_train
  - override /benchmark/nav/socialnav_v2: falcon_hm3d_real_world_task_for_train
  - override /habitat/task/lab_sensors@habitat.task.lab_sensors.agent_0_pointgoal_with_gps_compass: noisy_pointgoal_with_gps_compass_sensor
  - _self_

habitat:
  task:
    actions:
      agent_0_discrete_stop:
        lin_speed: 0.0
        ang_speed: 0.0
      agent_0_discrete_move_forward:
        lin_speed: 1.5
        ang_speed: 0.0
        allow_dyn_slide: True
      agent_0_discrete_turn_left:
        lin_speed: 0.0
        ang_speed: 1.5
        allow_dyn_slide: True
      agent_0_discrete_turn_right:
        lin_speed: 0.0
        ang_speed: -1.5
        allow_dyn_slide: True
      agent_1_oracle_nav_randcoord_action_obstacle:
        lin_speed: 1.0
        ang_speed: 1.0
      agent_2_oracle_nav_randcoord_action_obstacle:
        lin_speed: 1.0
        ang_speed: 1.0
      agent_3_oracle_nav_randcoord_action_obstacle:
        lin_speed: 1.0
        ang_speed: 1.0
      agent_4_oracle_nav_randcoord_action_obstacle:
        lin_speed: 1.0
        ang_speed: 1.0
      agent_5_oracle_nav_randcoord_action_obstacle:
        lin_speed: 1.0
        ang_speed: 1.0
      agent_6_oracle_nav_randcoord_action_obstacle:
        lin_speed: 1.0
        ang_speed: 1.0
    lab_sensors:
      agent_0_pointgoal_with_gps_compass:
        noise_enabled: true
        sigma_r: 0.04 #每帧距离噪声，单位 m
        sigma_theta: 0.032 #每帧角度噪声，单位 rad
        drift_r_std: 0.0015 #距离随机游走漂移，每帧累积
        drift_theta_std: 0.0012 # 角度随机游走漂移，每帧累积，单位 rad

habitat_baselines:
  tensorboard_dir: "training/falcon/hm3d_real_world/tb"
  video_dir: "evaluation/falcon/hm3d_real_world/video"
  checkpoint_folder: "evaluation/falcon/hm3d_real_world/checkpoints"
  rl:

    ddppo:
      pretrained_weights: weights/ours_hm3d_val_best.pth
