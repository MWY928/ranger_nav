# @package _global_

defaults:
  - falcon_hm3d_real_world
  # Use the same task/sensors/measurements and episode limit as training.
  # This is required for the pause/no-progress logic in multi_agent_nav_reward.
  - override /benchmark/nav/socialnav_v2: falcon_hm3d_real_world_task_for_train
  - _self_

habitat:
  gym:
    obs_keys:
      - agent_0_articulated_agent_jaw_depth
      - agent_0_pointgoal_with_gps_compass
      - agent_0_localization_sensor
      - agent_0_human_num_sensor
      - agent_0_oracle_humanoid_future_trajectory
  task:
    actions:
      agent_0_discrete_stop:
        lin_speed: 0.0
        ang_speed: 0.0
      agent_0_discrete_move_forward:
        lin_speed: 1.5
        ang_speed: 0.0
        allow_dyn_slide: True
      agent_0_discrete_turn_left:
        lin_speed: 0.0
        ang_speed: 1.5
        allow_dyn_slide: True
      agent_0_discrete_turn_right:
        lin_speed: 0.0
        ang_speed: -1.5
        allow_dyn_slide: True
      agent_1_oracle_nav_randcoord_action_obstacle:
        lin_speed: 1.0
        ang_speed: 1.0
      agent_2_oracle_nav_randcoord_action_obstacle:
        lin_speed: 1.0
        ang_speed: 1.0
      agent_3_oracle_nav_randcoord_action_obstacle:
        lin_speed: 1.0
        ang_speed: 1.0
      agent_4_oracle_nav_randcoord_action_obstacle:
        lin_speed: 1.0
        ang_speed: 1.0
      agent_5_oracle_nav_randcoord_action_obstacle:
        lin_speed: 1.0
        ang_speed: 1.0
      agent_6_oracle_nav_randcoord_action_obstacle:
        lin_speed: 1.0
        ang_speed: 1.0
    lab_sensors:
      agent_0_pointgoal_with_gps_compass:
        noise_enabled: true
        sigma_r: 0.04
        sigma_theta: 0.032
        drift_r_std: 0.0015
        drift_theta_std: 0.0012

habitat_baselines:
  rl:
    auxiliary_losses:
      people_counting:
        max_human_num: 6
        loss_scale: 0.1
      guess_human_position:
        max_human_num: 6
        position_dim: 2
        loss_scale: 0.1
      future_trajectory_prediction:
        max_human_num: 6
        future_step: 4
        loss_scale: 0.1
